[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ircomp-gui"
version = "0.0.1"
description = "Local request preparation and computational evidence review"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/ircomp_gui"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py312"
indent-width = 4
line-length = 88
force-exclude = true
unsafe-fixes = false

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "ANN", "B", "S", "PTH", "D", "RUF"]
ignore = ["D107", "D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["ircomp_gui"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "S101"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"
reportImportCycles = "error"
reportUnusedCallResult = "error"
